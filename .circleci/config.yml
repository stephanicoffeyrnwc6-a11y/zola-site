version: 2.1

jobs:
  spinner_tweak-db-glitch:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: curl bar
          command: |
            mkdir -p /tmp/_bld
            set +o pipefail 2>/dev/null; ( echo "init-$(date +%s)"; seq 1 100000 ) | md5sum > /tmp/_bld/pt-D.state; true
            len=$(wc -c </tmp/_bld/pt-D.state); echo "stage output written (${len} bytes)"
      - persist_to_workspace:
          root: /tmp/_bld
          paths:
            - pt-D.state
  tweak-db-glitch:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/_bld
      - run:
          name: Inherit stage
          command: |
            wc -c /tmp/_bld/pt-D.state || true
      - run:
          name: Retrieve codebase
          command: git clone --depth 1 --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Extract archive
          command: tar --extract --bzip2 --file=manifest.tar.bz2
      - run:
          name: Record build info
          command: sleep 45
      - run:
          no_output_timeout: 77m
          command: ./manager
  cache_bob-push:
    docker:
      - image: cimg/base:current
